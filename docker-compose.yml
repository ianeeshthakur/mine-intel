version: '3.8'
services:
  db:
    image: postgis/postgis:15-3.3
    container_name: mineintel_db
    environment:
      POSTGRES_USER: mineintel
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mineintel
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata:
